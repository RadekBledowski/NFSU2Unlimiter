; NFSU2Unlimiter wheel brand definition
; One brand per file, applied on top of UnlimiterData\_RimBrands.ini. A file naming a brand
; the ini already has replaces that entry and keeps its place; a new one is appended.
; Only the first section is read, whatever it is called.
;
; BrandName is matched against the BRAND_NAME attribute on the rim parts in Binary.

[RimBrand]
BrandName = "OASIS"
String = "RIMS_BRAND_OASIS"
Texture = "VISUAL_RIMS_BRAND_OASIS"
AvailableForRegularCars = 1
AvailableForSUVs = 0
