; NFSU2Unlimiter wheel brand definition
; BrandName must exactly match the BRAND_NAME attribute on the rim parts in Binary.
; It is hashed, not displayed - keep it plain ASCII. The visible name comes from String.

[RimBrand]
BrandName = "FOXX"
String = "RIMS_BRAND_FOXX"
Texture = "DECAL_ICON_FOXX"
AvailableForRegularCars = 0
AvailableForSUVs = 1
NoRimSize = 0
HideBrandName = 0
Order = 80
Enabled = 1
