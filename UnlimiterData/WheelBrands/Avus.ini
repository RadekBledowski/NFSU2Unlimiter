; NFSU2Unlimiter wheel brand definition
; BrandName is hashed and matched against the BRAND_NAME attribute on the rim parts in Binary,
; so it must be plain ASCII. The name the player sees comes from String.

[RimBrand]
BrandName = "AVUS"
String = "RIMS_BRAND_AVUS"
Texture = "DECAL_ICON_AVUS"
AvailableForRegularCars = 1
AvailableForSUVs = 0
